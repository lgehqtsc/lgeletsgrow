<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-뉴딜 교육참가확인서</title>

<style>

*{ box-sizing:border-box; }

body{
    font-family:'Malgun Gothic',sans-serif;
    background:#eef0f2;
    margin:20px;
}

/* ===================== 입력영역 ===================== */

.input-area{
    background:#ffffff;
    padding:24px 28px;
    border-radius:12px;
    margin:0 auto 24px;
    max-width:900px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}

.input-area h2{
    margin:0 0 18px;
    font-size:19px;
    color:#a50034;
    border-left:5px solid #a50034;
    padding-left:10px;
}

.input-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px 18px;
}

.input-row{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.input-row.wide{
    grid-column:span 2;
}

.input-row label{
    font-size:13px;
    font-weight:700;
    color:#555;
}

.input-row input,
.input-row select{
    width:100%;
    padding:9px 10px;
    font-size:14px;
    border:1px solid #d5d5d5;
    border-radius:6px;
    background:#fafafa;
}

.input-row input:focus,
.input-row select:focus{
    outline:none;
    border-color:#a50034;
    background:#fff;
}

.btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn-row button{
    border:none;
    color:#fff;
    padding:12px 22px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    transition:opacity .15s;
}

.btn-row button:hover{ opacity:.88; }

#btnPdf{ background:#16a34a; }
#btnPrint{ background:#ea580c; }
#btnReset{ background:#6b7280; }

/* ===================== 인증서 (A4 = 210mm x 297mm) ===================== */

.page-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
}

.certificate{
    width:210mm;
    height:297mm;
    flex:0 0 auto;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    flex:0 0 auto;
    text-align:center;
    padding:24mm 0 12mm;
}

.header .main-title{
    font-size:40px;
    font-weight:900;
    letter-spacing:6px;
    color:#222;
}

.body-wrap{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16mm;
}

.info-table{
    width:100%;
    border-collapse:collapse;
}

.certificate.page2{
    align-items:center;
    justify-content:center;
    padding:0;
}

.page2-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info-table th{
    width:30%;
    background:#f6f2ef;
    color:#444;
    border:1px solid #ddd;
    padding:16px 18px;
    font-size:16px;
    font-weight:700;
    text-align:center;
}

.info-table td{
    border:1px solid #ddd;
    padding:16px 18px;
    font-size:16px;
    background:#ffffff;
    color:#222;
}

.confirm-line{
    flex:0 0 auto;
    text-align:center;
    padding:6mm 16mm 0;
    font-size:16px;
    font-weight:700;
    color:#333;
}

.sign-line{
    flex:0 0 auto;
    text-align:center;
    padding:10mm 16mm 8mm;
    font-size:24px;
    font-weight:700;
    color:#333;
}

/* 하단 1/3 - 출입 Process (색상 배경, 박스 아님) */

.footer{
    flex:0 0 33%;
    background:#f6f2ef;
    color:#333;
    padding:12mm 16mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.footer-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:14px;
    letter-spacing:1px;
    color:#a50034;
}

.footer ul{
    margin:0 0 16px;
    padding-left:20px;
    line-height:2;
    font-size:14px;
}

.footer ul li{
    color:#444;
}

.address{
    font-size:13px;
    color:#666;
    border-top:1px solid rgba(0,0,0,.15);
    padding-top:12px;
}

/* ===================== 출력 / PDF ===================== */

@media print{

    .input-area{
        display:none;
    }

    body{
        background:#fff;
        margin:0;
    }

    .page-wrap{
        display:block;
    }

    .certificate{
        box-shadow:none;
        margin:0;
        page-break-after:always;
    }

    .certificate:last-child{
        page-break-after:auto;
    }

    @page{
        size:A4;
        margin:0;
    }
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="input-area">

<h2>교육참가 확인서 입력</h2>

<div class="input-grid">

<div class="input-row">
<label>성명</label>
<input type="text" id="name" oninput="applyData()">
</div>

<div class="input-row">
<label>연락처</label>
<input type="text" id="phone" oninput="applyData()">
</div>

<div class="input-row wide">
<label>교육기간</label>
<select id="lectureDate" onchange="applyData()">
<option>교육기간 선택</option>
<option>2026-08-18(화) ~ 2026-08-21(금)</option>
<option>2026-08-24(월) ~ 2026-08-28(금) </option>
</select>
</div>

<div class="input-row wide">
<label>지역담당자 및 연락처</label>
<select id="manager" onchange="applyData()">
<option>담당자 선택</option>
<option>[대전] 한진수 (010-2428-1844)</option>
<option>[대구] 김나영 (010-3087-2028)</option>
<option>[부산] 조운지 (010-8997-1812)</option>
</select>
</div>

</div>

<div class="btn-row">
<button id="btnPdf" onclick="savePDF()">PDF 저장하기</button>
<button id="btnPrint" onclick="printCertificate()">출력하기</button>
<button id="btnReset" onclick="resetForm()">초기화</button>
</div>

</div>

<div class="page-wrap" id="pdfContent">
<div class="certificate" id="certificate">

<div class="header">
<div class="main-title">K-뉴딜 교육참가확인서</div>
</div>

<div class="body-wrap">
<table class="info-table">

<tr>
<th>성 명</th>
<td id="pName"></td>
</tr>

<tr>
<th>연락처</th>
<td id="pPhone"></td>
</tr>

<tr>
<th>과정명</th>
<td>K-뉴딜 아카데미</td>
</tr>

<tr>
<th>교육기간</th>
<td id="pLectureDate"></td>
</tr>

<tr>
<th>장 소</th>
<td>러닝센터 이음관</td>
</tr>

<tr>
<th>지역담당자 및 연락처</th>
<td id="pManager"></td>
</tr>

</table>
</div>

<div class="confirm-line">러닝센터에서 운영하는 교육과정 참석자임을 확인합니다.</div>

<div class="sign-line">Employee eXperience 담당</div>

<div class="footer">

<div class="footer-title">출입 Process</div>

<ul>
<li>배차 차량 탑승 교육생도 반드시 출력 후 지참</li>
<li>차량은 서문 Gate 앞 주차장에 주차 후 입소</li>
<li>교육참가 확인서 출력 후 서문 Gate 제출/확인</li>

</ul>

<div class="address">
주소 : 경기 평택시 진위면 엘지로 222 LG전자 디지털파크 서문
</div></div>

</div>

<div class="certificate page2" id="certificatePage2">
<img class="page2-img" crossorigin="anonymous"
src="https://raw.githubusercontent.com/lgehqtsc/lgeletsgrow/refs/heads/main/IMG_7400.png"
alt="첨부 이미지">
</div>

</div>

<script>

function applyData(){

    document.getElementById('pName').innerText =
    document.getElementById('name').value;

    document.getElementById('pPhone').innerText =
    document.getElementById('phone').value;

    document.getElementById('pLectureDate').innerText =
    document.getElementById('lectureDate').value;

    document.getElementById('pManager').innerText =
    document.getElementById('manager').value;
}

function printCertificate(){
    applyData();
    window.print();
}

function savePDF(){

    applyData();

    const element = document.getElementById('pdfContent');

    const opt = {

        margin: 0,

        filename:
        '[LG전자]K-뉴딜_교육참가확인서_' +
        (document.getElementById('name').value || '무제') +
        '.pdf',

        image: {
            type: 'jpeg',
            quality: 1
        },

        html2canvas: {
            scale: 2,
            useCORS: true
        },

        jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
        },

        pagebreak: {
            mode: ['css']
        }

    };

    html2pdf()
    .set(opt)
    .from(element)
    .toPdf()
    .get('pdf')
    .then(function(pdf){
        // 의도한 2페이지를 초과하는 빈 페이지가 생성된 경우에만 삭제
        const totalPages = pdf.internal.getNumberOfPages();
        for(let i = totalPages; i > 2; i--){
            pdf.deletePage(i);
        }
    })
    .save();

}

function resetForm(){

    document.getElementById('name').value='';
    document.getElementById('phone').value='';
    document.getElementById('lectureDate').selectedIndex = 0;
    document.getElementById('manager').selectedIndex = 0;

    applyData();
}

window.onload = function(){
    applyData();
}

</script>

</body>
</html>
